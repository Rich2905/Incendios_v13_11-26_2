plugins {
    id 'com.android.application'
}

android {
    namespace 'mx.monitor.incendios'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.monitor.incendios'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
